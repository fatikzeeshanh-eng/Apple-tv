plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.appletvlauncher'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.example.appletvlauncher"
        minSdk 19            // Android 4.4 KitKat — as requested
        minSdkVersion 19
        targetSdk 19         // Keeps KitKat launcher behavior, no modern runtime permissions needed
        targetSdkVersion 19
        versionCode 11
        versionName "3.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero external dependencies — keeps the launcher tiny and KitKat-friendly
    // appcompat-v7:19.1.0 intentionally removed — plain Activity used, no support lib needed
}
